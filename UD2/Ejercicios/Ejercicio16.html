<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <title>Page Title</title>
</head>
<body>
    <h1>Patatas fritas</h1>
    <hr>
    <figure>
        <img src="../Ejercicios/imagenes/16-patatas-fritas.png" alt="Patatas fritas" width="288" height="185">
        <figcaption>Patatas fritas caseras</figcaption>
    </figure>
    <h2>Ingredientes</h2>
    <li>
        <ul>
            <li>2 o 4 patatas (300gr)</li>
            <li>4 dientes de ajo</li>
            <li>Aceite de oliva</li>
            <li>Sal</li>
        </ul>
    </li>
    <h2>Elaboracion (Pasos)</h2>
    <li>
        <ol>
            <li>Calentar aceite en una sartén</li>
            <li>Añadir patatas cortadas, la sal y los ajos</li>
            <li>Freir al gusto</li>
            <li>Emplatar</li>
        </ol>
    </li>
</body>
</html>
